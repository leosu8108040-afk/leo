name: Build MiniGameBrowser Group Manager EXE

on:
  workflow_dispatch:
  push:
    paths:
      - 'MiniGameBrowser_GroupManager_v8_CloudBuild.zip'
      - 'patch-auto-enter.ps1'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and extract source ZIP
        shell: pwsh
        run: |
          $zip = Join-Path $env:GITHUB_WORKSPACE 'MiniGameBrowser_GroupManager_v8_CloudBuild.zip'
          if (-not (Test-Path $zip)) {
            throw 'Missing MiniGameBrowser_GroupManager_v8_CloudBuild.zip in repository root.'
          }
          Expand-Archive -LiteralPath $zip -DestinationPath source -Force
          $project = Get-ChildItem -Path source -Filter MiniGameBrowserGroupManager.csproj -Recurse | Select-Object -First 1
          if (-not $project) { throw 'Could not find MiniGameBrowserGroupManager.csproj in the ZIP.' }
          "PROJECT_DIR=$($project.Directory.FullName)" >> $env:GITHUB_ENV

      - name: Inspect browser launch call
        shell: pwsh
        run: |
          $file = Join-Path $env:PROJECT_DIR 'ManagerForm.cs'
          $lines = Get-Content $file
          for ($i = 390; $i -lt [Math]::Min(455, $lines.Length); $i++) { '{0}: {1}' -f ($i + 1), $lines[$i] }

      - name: Apply automatic character entry feature
        shell: pwsh
        run: ./patch-auto-enter.ps1 -ProjectDir "$env:PROJECT_DIR"

      - name: Inspect patched source
        shell: pwsh
        run: |
          $file = Join-Path $env:PROJECT_DIR 'ManagerForm.cs'
          $lines = Get-Content $file
          for ($i = 410; $i -lt [Math]::Min(445, $lines.Length); $i++) { '{0}: {1}' -f ($i + 1), $lines[$i] }

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Show build environment
        run: dotnet --info

      - name: Restore
        shell: pwsh
        run: dotnet restore "$env:PROJECT_DIR/MiniGameBrowserGroupManager.csproj"

      - name: Compile Release
        shell: pwsh
        run: dotnet build "$env:PROJECT_DIR/MiniGameBrowserGroupManager.csproj" -c Release --no-restore

      - name: Publish self-contained Windows x64
        shell: pwsh
        run: dotnet publish "$env:PROJECT_DIR/MiniGameBrowserGroupManager.csproj" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o "$env:GITHUB_WORKSPACE/artifacts/publish"

      - name: Add runtime notes
        shell: pwsh
        run: |
          @'
          MiniGameBrowser Group Manager
          Windows x64 self-contained build.
          Microsoft Edge WebView2 Evergreen Runtime is required.
          Automatic character entry: browser window 1 selects the first visible Enter button, window 2 the second, and so on.
          This is an independent group-manager prototype, not the original vendor application.
          '@ | Set-Content "$env:GITHUB_WORKSPACE/artifacts/publish/使用說明.txt" -Encoding utf8

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiniGameBrowserGroupManager-win-x64
          path: artifacts/publish/*
          if-no-files-found: error
          retention-days: 30
