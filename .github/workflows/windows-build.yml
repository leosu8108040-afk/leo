name: Windows x64 build

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/windows-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout build workflow
        uses: actions/checkout@v4

      - name: Checkout RO Idle Tray source
        uses: actions/checkout@v4
        with:
          repository: mike623/ro-idle-tray
          ref: 93f9bcec8419ba9b243826cfce007361bea5a412
          path: source

      - name: Prepare Windows-compatible Rust code
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          root = Path("source")
          lib_path = root / "src-tauri/src/lib.rs"
          lib = lib_path.read_text(encoding="utf-8")

          old = '/// Native macOS dialog via osascript (no dialog plugin). True when `ok` was clicked.\nfn dialog('
          new = '''#[cfg(target_os = "macos")]
          /// Native macOS dialog via osascript (no dialog plugin). True when `ok` was clicked.
          fn dialog('''
          if old not in lib:
              raise SystemExit("Could not locate the macOS dialog function")
          lib = lib.replace(old, new, 1)

          marker = '#[cfg(target_os = "macos")]\n/// Native macOS dialog'
          windows_dialog = '''#[cfg(target_os = "windows")]
          fn dialog(message: &str, _ok: &str, cancel: Option<&str>) -> bool {
              use windows_sys::Win32::UI::WindowsAndMessaging::{
                  MessageBoxW, IDOK, MB_ICONWARNING, MB_OK, MB_OKCANCEL,
              };
              let message: Vec<u16> = message.encode_utf16().chain(std::iter::once(0)).collect();
              let title: Vec<u16> = "RO Idle Tray".encode_utf16().chain(std::iter::once(0)).collect();
              let flags = if cancel.is_some() {
                  MB_OKCANCEL | MB_ICONWARNING
              } else {
                  MB_OK | MB_ICONWARNING
              };
              unsafe {
                  MessageBoxW(std::ptr::null_mut(), message.as_ptr(), title.as_ptr(), flags) == IDOK
              }
          }

          '''
          if marker not in lib:
              raise SystemExit("Could not locate insertion point for Windows dialog")
          lib = lib.replace(marker, windows_dialog + marker, 1)

          old_open = '        let _ = std::process::Command::new("/usr/bin/open").arg(dir).spawn();'
          new_open = '''        #[cfg(target_os = "macos")]
                  let _ = std::process::Command::new("/usr/bin/open").arg(&dir).spawn();
                  #[cfg(target_os = "windows")]
                  let _ = std::process::Command::new("explorer.exe").arg(&dir).spawn();
                  #[cfg(all(not(target_os = "macos"), not(target_os = "windows")))]
                  let _ = std::process::Command::new("xdg-open").arg(&dir).spawn();'''
          if old_open not in lib:
              raise SystemExit("Could not locate export-folder opener")
          lib = lib.replace(old_open, new_open, 1)
          lib_path.write_text(lib, encoding="utf-8")

          cargo_path = root / "src-tauri/Cargo.toml"
          cargo = cargo_path.read_text(encoding="utf-8")
          if 'target_os = "windows"' not in cargo:
              cargo += '\n[target.\'cfg(target_os = "windows")\'.dependencies]\nwindows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }\n'
              cargo_path.write_text(cargo, encoding="utf-8")
          print("Windows platform adaptations applied.")
          '@ | Set-Content -Path prepare_windows.py -Encoding utf8
          python prepare_windows.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
          # Windows runner uses the MSVC toolchain.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: source/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: source
        run: npm ci

      - name: Build Windows installers
        working-directory: source
        run: npm run tauri -- build --bundles nsis,msi

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: RO-Idle-Tray-Windows-x64
          if-no-files-found: error
          path: |
            source/src-tauri/target/release/bundle/nsis/*.exe
            source/src-tauri/target/release/bundle/msi/*.msi
